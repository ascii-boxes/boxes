name: build

on: [push, pull_request, workflow_dispatch]

env:
    TERM: xterm-color

jobs:
    build-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: add-packages
              run: |
                  sudo apt-get update -y
                  sudo apt-get install -y git flex bison libunistring-dev libpcre2-dev libncurses-dev diffutils vim-common lcov libcmocka-dev

            - name: make cov
              run: make cov

            - name: Run white-box tests
              run: make utest

            - name: Run sunny-day tests
              run: make covtest-sunny

            - name: Run black-box tests
              run: make covtest

            - name: Coveralls
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: out/lcov-total.info
                  format: lcov
                  flag-name: run-linux
                  parallel: true

    build-macos:
        runs-on: macos-26
        env:
          BX_LEX: /opt/homebrew/opt/flex/bin/flex
          BX_YACC: /opt/homebrew/opt/bison/bin/bison
          CFLAGS_ADDTL: -I/opt/homebrew/include
          LDFLAGS_ADDTL: -L/opt/homebrew/lib
        steps:
            - uses: actions/checkout@v6

            # We need GNU userland tools and a real GCC/gcov pair on macOS
            - name: add-packages
              run: |
                  brew trust coverallsapp/coveralls
                  brew install flex bison diffutils lcov cmocka gcc grep gnu-sed findutils
                  echo "CC=$(printf '%s\n' /opt/homebrew/bin/gcc-[0-9]* | sort -t- -k2,2n | tail -n 1)" >> "$GITHUB_ENV"
                  echo "GCOV_TOOL=$(printf '%s\n' /opt/homebrew/bin/gcov-[0-9]* | sort -t- -k2,2n | tail -n 1)" >> "$GITHUB_ENV"
                  echo '/opt/homebrew/opt/grep/libexec/gnubin' >> $GITHUB_PATH
                  echo '/opt/homebrew/opt/gnu-sed/libexec/gnubin' >> $GITHUB_PATH
                  echo '/opt/homebrew/opt/findutils/libexec/gnubin' >> $GITHUB_PATH

            - name: make cov
              run: make cov

            - name: Run white-box tests
              run: make utest

            - name: Run sunny-day tests
              run: make covtest-sunny

            - name: Run black-box tests
              run: make covtest

            - name: Coveralls
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: out/lcov-total.info
                  format: lcov
                  flag-name: run-macos
                  parallel: true

    build-windows:
        runs-on: windows-2022
        env:
            LANG: en_US.UTF-8
            LC_CTYPE: en_US.UTF-8
            TERM: xterm-color
            WINDOWS_PCRE2_INCLUDE: /ucrt64/include
            WINDOWS_PCRE2_LDFLAGS: -L/ucrt64/lib
            WINDOWS_LEX: flex
            WINDOWS_YACC: bison
            WINDOWS_CMOCKA_DLL: /ucrt64/bin/libcmocka.dll
            WINDOWS_CMOCKA_INCLUDE: /ucrt64/include
            WINDOWS_CMOCKA_LDFLAGS: -L/ucrt64/lib
        defaults:
            run:
                shell: msys2 {0}
        steps:
            - uses: actions/checkout@v6

            - name: add-packages
              uses: msys2/setup-msys2@v2
              with:
                  msystem: UCRT64
                  update: true
                  install: >-
                      bison
                      diffutils
                      dos2unix
                      flex
                      git
                      make
                      unzip
                      vim
                      zip
                  pacboy: >-
                      cmocka:p
                      gcc:p
                      libiconv:p
                      libunistring:p
                      pcre2:p

            - name: Build boxes.exe
              run: make windows

            - name: Run white-box tests
              run: make windows.utest

            - name: Run sunny-day tests
              run: make test-sunny

            - name: Run black-box tests
              run: |
                # Skip one test that makes no sense on Windows
                rm -f test/205_invalid_encoding_system_fallback.txt
                make test

            - name: Save boxes.exe artifact
              if: ${{ always() && hashFiles('out/boxes.exe') != '' }}
              uses: actions/upload-artifact@v7
              with:
                  name: boxes.exe
                  path: out/boxes.exe
                  retention-days: 30

    finish:
      needs: [build-linux, build-macos, build-windows]
      if: ${{ always() }}
      runs-on: ubuntu-latest
      steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: "run-linux,run-macos"
